plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url 'https://jitpack.io' }
	maven { url 'https://api.modrinth.com/maven' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"coflmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations.all {
    resolutionStrategy {
        // For changing modules (like SNAPSHOTs), check every 0 seconds (i.e., always check)
        cacheChangingModulesFor(0, "seconds")
        // For dynamic versions (like '[1.0, 2.0)'), cache for a short period
        cacheDynamicVersionsFor(60, "minutes")
    }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation include("com.github.Coflnet:CoflSkyCore:74048c959f")
	implementation include("org.greenrobot:eventbus-java:3.3.1")
	implementation include("org.java-websocket:Java-WebSocket:1.5.2")
	implementation include("com.google.code.gson:gson:2.10.1")
	implementation include("com.neovisionaries:nv-websocket-client:2.14")
	implementation "maven.modrinth:yacl:3.9.4+26.2-fabric"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter-api"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

tasks.named("test", Test) {
	useJUnitPlatform()
}

tasks.register("runDescriptionStub", JavaExec) {
	group = "verification"
	description = "Runs the loopback-only deterministic description backend used by client rehearsal."
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.coflnet.core.DescriptionBackendStub"
}

processResources {
	inputs.property "version", project.version
	inputs.property "loader_version", project.loader_version
	inputs.property "minecraft_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand inputs.properties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.register("installMod") {
	group = "build"
	description = "Builds and atomically installs the mod into -PmodsDir=<Minecraft mods directory>."
	dependsOn tasks.named("build")
	doLast {
		def modsDir = providers.gradleProperty("modsDir").orNull
		if (!modsDir) {
			throw new GradleException("Specify the Minecraft mods directory with -PmodsDir=<path>")
		}
		def destination = file(modsDir).toPath()
		def artifact = tasks.named("jar", Jar).get().archiveFile.get().asFile.toPath()
		def temporary = java.nio.file.Files.createTempFile(destination, ".skycofl-", ".tmp")
		try {
			java.nio.file.Files.copy(artifact, temporary, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			// Keep a running client's open ZIP reader on the old, intact jar until restart.
			java.nio.file.Files.move(temporary, destination.resolve(artifact.fileName),
					java.nio.file.StandardCopyOption.ATOMIC_MOVE, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		} finally {
			java.nio.file.Files.deleteIfExists(temporary)
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
