# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.
#
# Supported branches:
# - main: Latest version (Minecraft 26.3, Java 25)
# - 26.2: Maintenance branch (Minecraft 26.2, Java 25)
# - 26.1: Backport branch with feature parity (Minecraft 26.1.2, Java 25)

name: build
on:
  push:
    tags-ignore:
      - '**'
    branches:
      - 'main'
      - '26.2'
      - '26.1'
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - java: 25
            branch: main
            minecraft_version: "26.3"
            fabric_version: "0.160.6+26.3"
          - java: 25
            branch: "26.2"
            minecraft_version: "26.2"
            fabric_version: "0.152.2+26.2"
          - java: 25
            branch: "26.1"
            minecraft_version: "26.1.2"
            fabric_version: "0.149.1+26.1.2"
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          # Build the tagged main commit on release, and the triggering commit for branch/PR checks.
          ref: ${{ github.event_name == 'release' && matrix.branch == 'main' && github.event.release.tag_name || matrix.branch == (github.base_ref || github.ref_name) && github.sha || matrix.branch }}
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [[ "${RELEASE_TAG#v}" != "$VERSION" ]]; then
            echo "::error::Release $RELEASE_TAG does not match ${{ matrix.branch }} mod_version=$VERSION"
            exit 1
          fi
      - name: setup build JDK 26 (target Java 25)
        uses: actions/setup-java@v4
        with:
          java-version: 26
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: rename jar file
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          mv "build/libs/SkyCofl-${VERSION}.jar" "build/libs/SkyCofl-${VERSION}-Fabric-${{ matrix.minecraft_version }}.jar"
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ matrix.minecraft_version }}
          path: build/libs/
      - name: Publish to CurseForge, Modrinth, and GitHub Release
        uses: Kir-Antipov/mc-publish@v3.3
        if: github.event_name == 'release'
        with:
          curseforge-id: 1286702
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: yso5yMlC
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}

          # These are shared mc-publish fields for all targets.
          # If Modrinth, CurseForge, or GitHub ever need different values,
          # use target-specific keys such as modrinth-name or github-version.
          name: "SkyCofl ${{ github.ref_name }} Fabric ${{ matrix.minecraft_version }}"
          version: "${{ github.ref_name }}_Fabric_${{ matrix.minecraft_version }}"
          changelog: |
            ${{ github.event.release.body }}
            [View on GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})
          loaders: fabric
          game-versions: "${{ matrix.minecraft_version }}"
          java: ${{ matrix.java }}
          # Tag naming protects pre releases even if the GitHub prerelease checkbox was missed.
          version-type: ${{ (github.event.release.prerelease || contains(github.event.release.tag_name, '-')) && 'beta' || 'release' }}

          files: |
            build/libs/SkyCofl-*-Fabric-*.jar
          dependencies: |
            fabric@${{ matrix.fabric_version }}(required){modrinth:P7dR8mSH}{curseforge:306612}#(ignore:github)
            yacl(optional){modrinth:1eAoo2KR}{curseforge:667299}#(ignore:github)
